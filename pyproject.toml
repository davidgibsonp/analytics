[project]
name = "analytics"
version = "0.1.0"
description = "Analytical projects: shared data sources and features, thin per-question analyses."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
# Semantic text embeddings (pulls in PyTorch, ~1-2 GB). Install with: uv sync --extra embeddings
embeddings = ["sentence-transformers>=3.0"]
# Interactive charts for human exploration. Install with: uv sync --extra viz
viz = ["plotly>=5.24"]

[project.scripts]
analytics = "analytics.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7", "pre-commit>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PD002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
